name: Sincronizar contratos

on:
  schedule:
    # Executa diariamente às 06h de Brasília (09h UTC).
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronizar-contratos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Bahia
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar navegador Chromium do Playwright
        run: python -m playwright install --with-deps chromium

      - name: Calcular início dos últimos 10 dias
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from datetime import date, timedelta
          print(f"START_DATE={(date.today() - timedelta(days=9)).isoformat()}")
          PY

      - name: Coletar contratos em modo headless
        run: python scraper_contratos.py --start "$START_DATE" --headless

      - name: Salvar JSON atualizado no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/contratos.json dados/checkpoint.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos dados."
          else
            git commit -m "Atualiza contratos da transparência"
            git push
          fi
          
