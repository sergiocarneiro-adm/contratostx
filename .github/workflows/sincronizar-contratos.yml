name: Atualizar contratos e itens

on:
  schedule:
    # Executa diariamente às 06h de Brasília (09h UTC).
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronizar-contratos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Bahia
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar navegador Chromium do Playwright
        run: python -m playwright install --with-deps chromium

      - name: Coletar contratos e itens em modo headless
        run: python sync_resultcontratos_diario.py

      - name: Salvar diagnóstico de falha do portal
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostico-portal-${{ github.run_id }}
          path: diagnosticos/portal_acesso.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Salvar JSON atualizado no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/resultcontratos.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos dados."
          else
            git commit -m "Atualiza contratos e itens da transparência"
            git push
          fi
